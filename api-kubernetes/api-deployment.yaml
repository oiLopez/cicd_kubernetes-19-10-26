apiVersion: apps/v1 
kind: Deployment 
metadata: 
  name: api-deployment 
spec: 
  replicas: 3 
  selector: 
    matchLabels: 
      app: api 
  template: 
    metadata: 
      labels: 
        app: api 
    spec: 
      containers: 
        - name: api 
          image: api-kubernetes:v1
          imagePullPolicy: Never 
          ports: 
            - containerPort: 3000 